<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AEREDIUM Wallet Dashboard</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

</head>

<body>

<div class="container">

    <h1>🌊 AEREDIUM Wallet Dashboard</h1>

    <p class="subtitle">
        Connect your Rabby Wallet and monitor your assets.
    </p>

    <button id="connectButton">
        Connect Wallet
    </button>
<button id="switchButton">
    Switch to AEREDIUM Testnet
</button>
    <div class="card">

        <h3>Status</h3>
        <p id="status">Disconnected</p>

        <h3>Wallet</h3>
        <p id="walletAddress">Not Connected</p>

        <h3>Network</h3>
        <p id="networkName">—</p>

        <h3>Balance</h3>
        <p id="walletBalance">—</p>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
